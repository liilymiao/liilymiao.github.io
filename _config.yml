title: "liilymiao"
description: "Photography albums and personal notes from Hong Kong and beyond."
url: "https://liilymiao.github.io"
theme: jekyll-theme-modernist
author: liilymiao
lang: en
timezone: Asia/Hong_Kong

plugins:
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-sitemap

exclude: [album_backup_*, node_modules, vendor, script, tools, "*.bak", .fresh_build.txt, .rebuild.txt]

defaults:
  - scope:
      path: ""
      type: posts
    values:
      comments: true
